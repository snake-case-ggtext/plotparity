[project]
name = "plotparity"
version = "0.1.0"
description = "Compare two engines' renderings of the same graphic (e.g. a ggplot2 extension vs its plotnine port) with structured, agent-actionable findings."
authors = [
    { name = "Jonathan Soma", email = "jonathan.soma@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "plotnine==0.15.9",
    "matplotlib==3.11.2",
    "numpy>=2",
    "pandas>=2",
    "scipy>=1.13",
    "pyyaml>=6",
    "pillow>=10",
    "scikit-image>=0.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
plotparity = "plotparity.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: renders plots (seconds)"]

[tool.uv]
# Rebuild when any packaged file changes (uv's default only watches pyproject.toml), so
# `uvx --from ./plotparity` always runs the current checkout.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
