# ggtext adapter profile: the single source of truth for which checks run, how strictly, and how important.
# severity: gating | advisory | off      tier: inventory | layout | style (orders feedback; fix lower tiers first)
# Every tolerance was frozen BEFORE mutation testing and calibrated on clean R/Python pairs only
# (experiment/REPORT.md, "frozen threshold profile"). Changing a tolerance: re-calibrate on clean pairs, then selftest.

# ---- inventory (core) ----
[checks.component_count]
severity = "gating"
tier = "inventory"
calibration = "exact count"

[checks.missing_component]
severity = "gating"
tier = "inventory"

[checks.unexpected_component]
severity = "gating"
tier = "inventory"

[checks.unexpected_drawing]
severity = "gating"
tier = "inventory"
calibration = "any port draw call outside a component"

[checks.extractor_blind]
severity = "gating"
tier = "inventory"
calibration = "no components but port ink: unmeasured"

[checks.text_content]
severity = "gating"
tier = "inventory"

# ---- layout ----
[checks.rotation]
severity = "gating"
tier = "layout"
tol = 2.0
calibration = "degrees; clean max 0"

[checks.centroid]
severity = "gating"
tier = "layout"
tol = 0.04
calibration = "canvas fraction; ggplot2/plotnine panels differ ~5px"

[checks.shape_size]
severity = "gating"
tier = "layout"
tol = 6.0
rel_tol = 0.12
calibration = "pt, or rel_tol × R size"

[checks.line_count]
severity = "gating"
tier = "layout"
tol = 0

[checks.line_breaks]
severity = "advisory"
tier = "layout"
calibration = "wrap points move with hinting"

[checks.text_overflow]
severity = "gating"
tier = "layout"
tol = 3.0
calibration = "pt beyond the frame"

[checks.padding]
severity = "gating"
tier = "layout"
tol = 2.0
calibration = "pt; clean max 1.21"

[checks.sup_sub_offset]
severity = "gating"
tier = "layout"
tol = 1.5
calibration = "pt; only |offset| ≥ tol"

# ---- style ----
[checks.text_color]
severity = "gating"
tier = "style"
tol = 6.0
calibration = "CIEDE2000; clean max 0"

[checks.text_alpha]
severity = "gating"
tier = "style"
tol = 0.05
calibration = "clean max 0"

[checks.text_visible]
severity = "gating"
tier = "inventory"
min = 0.5
calibration = "share inside clip; clean min 1.0"

[checks.ink_present]
severity = "gating"
tier = "inventory"
tol = 32
min = 1
calibration = "contrast 0–255; min ink px; clean min 1px"

[checks.font_weight]
severity = "gating"
tier = "style"

[checks.font_style]
severity = "gating"
tier = "style"

[checks.font_size]
severity = "gating"
tier = "style"
tol = 0.6
calibration = "pt; R 11.04 vs plotnine 11.0"

[checks.fill_color]
severity = "gating"
tier = "style"
tol = 6.0
alpha_tol = 0.05
calibration = "CIEDE2000; alpha clean max 0"

[checks.edge_color]
severity = "gating"
tier = "style"
tol = 6.0
alpha_tol = 0.05
calibration = "CIEDE2000; alpha clean max 0"

[checks.rounded_corners]
severity = "gating"
tier = "style"

[checks.raw_markup_leak]
severity = "gating"
tier = "inventory"

[checks.chrome_position]
severity = "gating"
tier = "layout"
tol = 0.10
calibration = "fraction of the panel; coarse on purpose (wrong alignment, side or order)"
